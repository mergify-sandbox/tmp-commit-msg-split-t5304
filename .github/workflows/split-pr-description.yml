name: Split PR description

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SEPARATOR = /^# PR description[ \t]*$/m;
            const COMMENT_MARKER = "<!-- pr-description -->";

            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: number,
            });
            const body = pr.body || "";
            const match = SEPARATOR.exec(body);
            if (!match) {
              core.info("No '# PR description' section, nothing to do.");
              return;
            }

            const commitMessage = body.slice(0, match.index).trim();
            const description = body.slice(match.index + match[0].length).trim();
            const commentBody = `${COMMENT_MARKER}\n## PR description\n\n${description}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith(COMMENT_MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: commentBody,
              });
            }

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: number,
              body: commitMessage,
            });
